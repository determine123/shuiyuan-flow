name: 五端构建
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: 安装 Linux 开发库
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - name: 静态检查与单元测试
        if: matrix.platform == 'linux'
        run: |
          flutter analyze
          flutter test
      - name: 构建 Android 测试包
        if: matrix.platform == 'android'
        run: flutter build apk --debug --target-platform android-arm64,android-x64
      - name: 构建无签名 iOS 工程产物
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign
      - name: 构建桌面应用
        if: matrix.platform != 'android' && matrix.platform != 'ios'
        run: flutter build ${{ matrix.platform }} --release
      - name: 打包 macOS
        if: matrix.platform == 'macos'
        run: tar -czf shuiyuan-macos.tar.gz -C build/macos/Build/Products/Release 'Shuiyuan Flow.app'
      - name: 打包 Linux
        if: matrix.platform == 'linux'
        run: tar -czf shuiyuan-linux.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: shuiyuan-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/ios/iphoneos/*.app
            build/windows/x64/runner/Release/
            shuiyuan-*.tar.gz
